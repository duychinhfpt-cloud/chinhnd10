<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quản trị · Đập Chuột</title>
<link rel="stylesheet" href="/design/tokens.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="thanh-tren">
  <div class="trong">
    <div class="thuong-hieu">ĐẬP <span>CHUỘT</span> · ADMIN</div>
    <nav class="tab" aria-label="Mục quản trị">
      <a href="#nguoi-choi" data-tab="nguoi-choi">Người chơi</a>
      <a href="#tai-khoan" data-tab="tai-khoan">Tài khoản admin</a>
    </nav>
    <div class="phai">
      <span id="tenAdmin" class="ten-admin"></span>
      <button id="btnDoiMk" class="lien-ket" type="button">Đổi mật khẩu</button>
      <button id="btnDangXuat" class="lien-ket" type="button">Đăng xuất</button>
    </div>
  </div>
</header>

<!-- ===== Người chơi ===== -->
<main id="mucNguoiChoi" class="noi-dung">
  <h1>Người chơi</h1>
  <div class="cong-cu">
    <div class="o-tim">
      <input id="tim" class="input" type="search" placeholder="Tìm họ tên, email, SĐT…" autocomplete="off" aria-label="Tìm kiếm">
    </div>
    <div class="nhom-nut">
      <a id="btnCsv" class="btn btn-primary" href="/api/admin/nguoi-choi.csv">Xuất CSV</a>
      <button id="btnXoaChon" class="btn btn-danger-solid" type="button" disabled>Xoá đã chọn</button>
    </div>
  </div>
  <p class="dem" id="dem" aria-live="polite">Đang tải…</p>

  <div class="bang-wrap">
    <table>
      <thead>
        <tr>
          <th class="o-chon"><input id="chonTatCa" type="checkbox" aria-label="Chọn tất cả"></th>
          <th><button class="sap" data-cot="hoTen">Họ tên</button></th>
          <th><button class="sap" data-cot="email">Email</button></th>
          <th><button class="sap" data-cot="soDienThoai">SĐT</button></th>
          <th><button class="sap" data-cot="dangKyLuc">Ngày đăng ký</button></th>
          <th class="so"><button class="sap" data-cot="soLuot">Số lượt</button></th>
          <th class="so"><button class="sap" data-cot="diemCaoNhat">Điểm cao nhất</button></th>
          <th><button class="sap" data-cot="lanChoiCuoi">Chơi gần nhất</button></th>
          <th><span class="sr-only">Thao tác</span></th>
        </tr>
      </thead>
      <tbody id="than"></tbody>
    </table>
  </div>
</main>

<!-- ===== Tài khoản admin ===== -->
<main id="mucTaiKhoan" class="noi-dung" hidden>
  <h1>Tài khoản admin</h1>
  <div class="hai-cot">
    <div class="bang-wrap">
      <table>
        <thead><tr><th>Tên đăng nhập</th><th>Tên hiển thị</th><th>Tạo lúc</th><th><span class="sr-only">Thao tác</span></th></tr></thead>
        <tbody id="thanTk"></tbody>
      </table>
    </div>
    <form id="formTk" class="the" novalidate>
      <h2>Thêm tài khoản</h2>
      <div class="field">
        <label for="tkTen">Tên đăng nhập</label>
        <input id="tkTen" name="tenDangNhap" class="input" autocomplete="off" placeholder="vd: thu.nguyen">
        <span class="loi-o" data-loi="tenDangNhap"></span>
      </div>
      <div class="field">
        <label for="tkHienThi">Tên hiển thị</label>
        <input id="tkHienThi" name="tenHienThi" class="input" autocomplete="off" placeholder="vd: Thu Nguyễn">
        <span class="loi-o" data-loi="tenHienThi"></span>
      </div>
      <div class="field">
        <label for="tkMk">Mật khẩu</label>
        <input id="tkMk" name="matKhau" type="password" class="input" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự">
        <span class="loi-o" data-loi="matKhau"></span>
      </div>
      <button class="btn btn-primary rong" type="submit">Thêm tài khoản</button>
    </form>
  </div>
</main>

<!-- ===== Hộp thoại ===== -->
<dialog id="hopXacNhan">
  <h2 id="xnTieuDe">Xoá?</h2>
  <p id="xnChu"></p>
  <div class="hang-nut">
    <button id="xnHuy" class="btn btn-ghost" type="button">Huỷ</button>
    <button id="xnDongY" class="btn btn-danger-solid" type="button">Xoá</button>
  </div>
</dialog>

<dialog id="hopChiTiet">
  <h2 id="ctTen"></h2>
  <dl id="ctDs" class="chi-tiet"></dl>
  <div class="hang-nut"><button class="btn btn-ghost" type="button" data-dong>Đóng</button></div>
</dialog>

<dialog id="hopDoiMk">
  <form id="formDoiMk" novalidate>
    <h2>Đổi mật khẩu</h2>
    <div class="field">
      <label for="mkCu">Mật khẩu hiện tại</label>
      <input id="mkCu" name="matKhauCu" type="password" class="input" autocomplete="current-password">
      <span class="loi-o" data-loi="matKhauCu"></span>
    </div>
    <div class="field">
      <label for="mkMoi">Mật khẩu mới</label>
      <input id="mkMoi" name="matKhauMoi" type="password" class="input" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự">
      <span class="loi-o" data-loi="matKhauMoi"></span>
    </div>
    <div class="field">
      <label for="mkLai">Nhập lại mật khẩu mới</label>
      <input id="mkLai" name="matKhauLai" type="password" class="input" autocomplete="new-password">
      <span class="loi-o" data-loi="matKhauLai"></span>
    </div>
    <div class="hang-nut">
      <button class="btn btn-ghost" type="button" data-dong>Huỷ</button>
      <button class="btn btn-primary" type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<div id="thongBao" class="thong-bao" role="status" hidden></div>
<script src="/admin/admin.js"></script>
</body>
</html>
